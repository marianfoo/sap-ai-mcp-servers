name: Add new entry
description: Suggest a new MCP server, skill, Claude plugin, or adjacent tool to be added to the list.
title: "[Add] "
labels: ["new entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new entry! Please fill in the details below.
        All fields marked with * are required.

        Fill in **either** the GitHub repository field **or** the non-GitHub URL field — not both.
        GitHub entries get auto-enriched (stars, license, last change). Non-GitHub entries are listed but not enriched.

  - type: dropdown
    id: category
    attributes:
      label: Category *
      description: Which section of the list does this belong to?
      options:
        - SAP MCP Server
        - SAP Skills
        - SAP Claude Plugins
        - Community SAP MCP Server
        - SAP Docs MCP Server
        - ABAP and ADT MCP Server
        - SAP Integration
        - OData MCP Proxy ecosystem
        - SAP Datasphere
        - SAP OData / Gateway / Graph MCP Server
        - SAP GUI
        - SAP HANA
        - SAP Cloud ALM
        - SAP AI Skills and Prompt Packs
        - SAP Claude Plugins and Skills
        - Adjacent SAP AI Developer Tools
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Display name *
      description: Short, human-readable name for the entry shown in the table.
      placeholder: e.g. My SAP MCP Server
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: Repository in `owner/repo` format. Leave blank if the project lives on a non-GitHub host (use the URL field below instead).
      placeholder: e.g. myorg/my-sap-mcp-server
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: Non-GitHub URL
      description: Full URL for entries hosted outside GitHub (e.g. Gitea, GitLab, Bitbucket, or an official documentation page). Use this OR the GitHub field above, not both.
      placeholder: e.g. https://git.example.dev/owner/repo
    validations:
      required: false

  - type: input
    id: purpose
    attributes:
      label: Purpose *
      description: One concise sentence describing what the tool does. No trailing period needed.
      placeholder: e.g. Exposes SAP BTP services as MCP tools
    validations:
      required: true

  - type: input
    id: notes
    attributes:
      label: Notes
      description: Any extra context, caveats, or notable characteristics (optional).
      placeholder: e.g. Requires BTP destination configuration
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The repository or URL is publicly reachable without authentication
          required: true
        - label: The repository is NOT a fork of an existing entry already in the list
          required: true
        - label: The project is SAP-related (MCP server, AI skill, Claude plugin, or adjacent developer tool)
          required: true
        - label: The repository has an open-source license
          required: true
