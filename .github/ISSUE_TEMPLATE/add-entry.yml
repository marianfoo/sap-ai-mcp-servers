name: Add new entry
description: Suggest a new SAP MCP server, AI skill, Claude plugin, or adjacent developer tool.
title: "[Add] "
labels: ["new entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new entry.

        Before submitting, please check the catalog for duplicates. Fill in either the GitHub repository field or the non-GitHub URL field, not both.
        GitHub repositories are auto-enriched with stars, license, and last-change metadata. Non-GitHub entries need manual metadata or clear evidence.
        If a repository ships both AI skills and a Claude Code plugin, choose the combined placement so it can appear in both package filters.

  - type: dropdown
    id: placement
    attributes:
      label: Catalog placement *
      description: Choose where this project should appear. Use the combined option when one repo contains both skill content and a Claude Code plugin.
      options:
        - MCP server
        - AI skill or prompt pack
        - Claude plugin
        - AI skill + Claude plugin
        - Adjacent developer tool
        - Documentation or official resource page
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category *
      description: Choose the closest existing catalog section.
      options:
        - Official SAP MCP Servers
        - ABAP & ADT
        - SAP Docs & Knowledge
        - OData, Gateway & Graph
        - SAP Integration (CPI / PI)
        - Data, Analytics & HANA
        - SAP GUI Automation
        - Operations, Monitoring & Lifecycle
        - Business Apps, Security & Governance
        - AI Skills & Claude Plugins
        - Libraries, SDKs & Adjacent Tools
    validations:
      required: true

  - type: dropdown
    id: source_type
    attributes:
      label: Source *
      description: Use SAP only for projects maintained by SAP-owned GitHub organizations or official SAP pages.
      options:
        - Community SAP
        - SAP
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Display name *
      description: Project or tool name shown in the catalog. Do not use a maintainer/person name unless that is the project name.
      placeholder: e.g. SAP FocusedRun MCP
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: Use owner/repo format only. Do not paste a full https://github.com/... URL. Leave blank for non-GitHub entries.
      placeholder: e.g. owner/sap-mcp-server
    validations:
      required: false

  - type: input
    id: repo_path
    attributes:
      label: Monorepo path
      description: Optional path if the project lives in a subfolder of the GitHub repository.
      placeholder: e.g. packages/fiori-mcp-server
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: Non-GitHub URL
      description: Full URL for entries hosted outside GitHub or for official resource pages. Use this only when GitHub repository is blank.
      placeholder: e.g. https://git.example.dev/owner/repo
    validations:
      required: false

  - type: input
    id: display_url
    attributes:
      label: Display URL override
      description: Optional link target when the catalog should link to a specific subfolder, package page, or official page.
      placeholder: e.g. https://github.com/owner/repo/tree/main/packages/server
    validations:
      required: false

  - type: textarea
    id: purpose
    attributes:
      label: Purpose *
      description: One concise sentence describing what the tool does for SAP developers. End with a period.
      placeholder: e.g. Exposes SAP Focused Run LMDB APIs as MCP tools for host, system, database, and tenant lookup.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Extra context, caveats, setup requirements, supported transports, notable tool coverage, or evidence for multi-placement.
      placeholder: e.g. Ships a .claude-plugin manifest and a skills/ folder; requires OAuth client credentials and supports stdio plus HTTP transports.
    validations:
      required: false

  - type: input
    id: primary_language
    attributes:
      label: Primary implementation language
      description: Optional. GitHub repositories are auto-detected. Fill this when the language is missing, wrong, or a monorepo subfolder differs from the repository default.
      placeholder: e.g. TypeScript, Python, Go, ABAP
    validations:
      required: false

  - type: input
    id: secondary_languages
    attributes:
      label: Significant secondary languages
      description: Optional. List only languages that are meaningfully used. The catalog language filter includes secondary languages at about 20% or more of the GitHub language breakdown.
      placeholder: e.g. ABAP ~40%, Python ~25%
    validations:
      required: false

  - type: input
    id: license_evidence
    attributes:
      label: License evidence
      description: Required if GitHub does not show a detected open-source license, or if this is a non-GitHub URL.
      placeholder: e.g. MIT, Apache-2.0, or link to LICENSE file
    validations:
      required: false

  - type: input
    id: duplicate_check
    attributes:
      label: Duplicate check
      description: Optional link/name if this is related to an existing catalog entry or previous issue.
      placeholder: e.g. Related to owner/existing-repo, but not a fork because ...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the catalog and did not find this exact project already listed
          required: true
        - label: The repository or URL is publicly reachable without authentication
          required: true
        - label: If I provided a GitHub repository, it uses owner/repo format and is not a full URL
          required: true
        - label: I did not fill both GitHub repository and Non-GitHub URL unless the URL is only a display override
          required: true
        - label: The project is SAP-related and fits one of the catalog sections above
          required: true
        - label: The project has an open-source license or I provided license evidence above
          required: true
        - label: If this should appear as both an AI skill and a Claude plugin, I selected the combined placement and explained the evidence in Notes
          required: false
